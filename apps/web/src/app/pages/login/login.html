<div class="login">
  <div class="login__card">
    <div class="login__brand">
      <img src="logo.svg" alt="" class="login__logo" />
      <h1>lazybudget</h1>
    </div>

    <form nz-form nzLayout="vertical" (submit)="$event.preventDefault(); submit()" novalidate>
      <app-form-field [field]="form.email" label="Email" for="email">
        <input
          nz-input
          id="email"
          type="email"
          [formField]="form.email"
          autocomplete="username"
          autofocus
        />
      </app-form-field>

      <app-form-field [field]="form.password" label="Password" for="password">
        <input
          nz-input
          id="password"
          type="password"
          [formField]="form.password"
          autocomplete="current-password"
        />
      </app-form-field>

      @if (errorMessage(); as message) {
        <nz-alert class="login__error" nzType="error" [nzMessage]="message" />
      }

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="login.isPending()">
        Log in
      </button>
    </form>

    <p class="login__alt">No account yet? <a routerLink="/register">Register</a></p>
  </div>
</div>
