<div class="login">
  <div class="login__card">
    <div class="login__brand">
      <img src="logo.svg" alt="" class="login__logo" />
      <h1>lazybudget</h1>
    </div>

    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <nz-form-item>
        <nz-form-label nzFor="email" nzRequired>Email</nz-form-label>
        <nz-form-control nzErrorTip="Enter a valid email address">
          <input
            nz-input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="username"
            autofocus
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password" nzRequired>Password</nz-form-label>
        <nz-form-control nzErrorTip="Enter your password">
          <input
            nz-input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </nz-form-control>
      </nz-form-item>

      @if (errorMessage(); as message) {
        <nz-alert class="login__error" nzType="error" [nzMessage]="message" />
      }

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="login.isPending()">
        Log in
      </button>
    </form>

    <p class="login__alt">No account yet? <a routerLink="/register">Register</a></p>
  </div>
</div>
