<div class="register">
  <div class="register__card">
    <div class="register__brand">
      <img src="logo.svg" alt="" class="register__logo" />
      <h1>lazybudget</h1>
    </div>

    <form nz-form nzLayout="vertical" (submit)="$event.preventDefault(); submit()" novalidate>
      <app-form-field [field]="form.name" label="Name" for="name">
        <input nz-input id="name" type="text" [formField]="form.name" autocomplete="name" />
      </app-form-field>

      <app-form-field [field]="form.email" label="Email" for="email">
        <input nz-input id="email" type="email" [formField]="form.email" autocomplete="username" />
      </app-form-field>

      <app-form-field [field]="form.password" label="Password" for="password">
        <input
          nz-input
          id="password"
          type="password"
          [formField]="form.password"
          autocomplete="new-password"
        />
      </app-form-field>

      <app-form-field
        [field]="form.password_confirmation"
        label="Confirm password"
        for="password_confirmation"
      >
        <input
          nz-input
          id="password_confirmation"
          type="password"
          [formField]="form.password_confirmation"
          autocomplete="new-password"
        />
      </app-form-field>

      @if (errorMessage(); as message) {
        <nz-alert class="register__error" nzType="error" [nzMessage]="message" />
      }

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="register.isPending()">
        Create account
      </button>
    </form>

    <p class="register__alt">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
