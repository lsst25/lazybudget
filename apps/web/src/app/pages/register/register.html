<div class="register">
  <div class="register__card">
    <div class="register__brand">
      <img src="logo.svg" alt="" class="register__logo" />
      <h1>lazybudget</h1>
    </div>

    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <nz-form-item>
        <nz-form-label nzFor="name" nzRequired>Name</nz-form-label>
        <nz-form-control nzErrorTip="Enter your name">
          <input nz-input id="name" type="text" formControlName="name" autocomplete="name" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="email" nzRequired>Email</nz-form-label>
        <nz-form-control nzErrorTip="Enter a valid email address">
          <input nz-input id="email" type="email" formControlName="email" autocomplete="username" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password" nzRequired>Password</nz-form-label>
        <nz-form-control nzErrorTip="Use at least 8 characters">
          <input
            nz-input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="new-password"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password_confirmation" nzRequired>Confirm password</nz-form-label>
        <nz-form-control [nzErrorTip]="confirmationError">
          <input
            nz-input
            id="password_confirmation"
            type="password"
            formControlName="password_confirmation"
            autocomplete="new-password"
          />
          <ng-template #confirmationError let-control>
            @if (control.hasError('mismatch')) {
              The passwords do not match
            } @else {
              Repeat your password
            }
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      @if (errorMessage(); as message) {
        <nz-alert class="register__error" nzType="error" [nzMessage]="message" />
      }

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="register.isPending()">
        Create account
      </button>
    </form>

    <p class="register__alt">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
